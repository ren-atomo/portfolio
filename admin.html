<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>管理ページ - 堤 廉太郎</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <header class="admin-header">
        <div class="admin-title">ポートフォリオ管理</div>
        <nav class="admin-tabs" id="tabs" hidden>
            <button type="button" data-tab="works" class="active">作品</button>
            <button type="button" data-tab="profile">プロフィール</button>
            <button type="button" data-tab="experiments">実験</button>
            <button type="button" data-tab="philosophy">思想</button>
            <button type="button" data-tab="settings">接続設定</button>
        </nav>
        <a href="index.html" class="admin-view-site" target="_blank" rel="noopener">サイトを見る</a>
    </header>

    <main class="admin-main" id="main"></main>

    <div class="save-bar" id="saveBar" hidden>
        <div class="save-status" id="saveStatus"></div>
        <input type="text" id="commitMessage" class="commit-message" placeholder="変更の説明（省略可）">
        <button type="button" id="saveButton" class="btn btn-primary">保存して公開</button>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="assets/js/admin.js"></script>
</body>
</html>
