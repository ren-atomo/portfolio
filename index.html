<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>堤 廉太郎 - portfolio</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/works.css">
</head>
<body data-page="works">
    <!-- ヘッダー・フッターは assets/js/site.js が自動で入れます -->
    <!-- 作品の追加・編集は data/works.js で行います -->

    <div class="container" id="works">
        <div class="works-mosaic" id="worksMosaic"></div>
    </div>

    <div class="home-philosophy">
        <a href="philosophy.html" class="home-philosophy-link">思想について</a>
    </div>

    <!-- 作品詳細 -->
    <div class="modal" id="workModal">
        <div class="modal-close" id="modalClose"></div>

        <div class="work-navigation work-nav-prev">
            <div class="work-nav-btn" id="prevWork"></div>
        </div>
        <div class="work-navigation work-nav-next">
            <div class="work-nav-btn" id="nextWork"></div>
        </div>

        <div class="modal-content">
            <div class="work-detail" id="workDetail"></div>
        </div>
    </div>

    <!-- 写真の拡大表示 -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxClose"></div>
        <div class="lightbox-nav lightbox-prev" id="lightboxPrev"></div>
        <div class="lightbox-nav lightbox-next" id="lightboxNext"></div>
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-image" id="lightboxImage">
        </div>
    </div>

    <script src="data/works.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/works.js"></script>
</body>
</html>
